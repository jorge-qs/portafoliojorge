document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

\n<\u002Fhelmet>\n<section data-screen-label=\"Fase 5A · Hero final\" style=\"padding:80px;background:#10141D;display:flex;flex-direction:column;gap:120px;width:max-content\">\n  <header style=\"display:flex;flex-direction:column;gap:14px;max-width:980px\">\n    <div style=\"font-size:14px;color:#8C929D\">Fase 5A · Cierre artístico del hero · Layout Cercano 2c · Estructura de Anatomía 3a · Escalas y vacío de Gesto 3c<\u002Fdiv>\n    <h1 style=\"margin:0;font-size:56px;font-weight:600;letter-spacing:-0.025em;line-height:1.1;color:#F4F1EA\">La mano que se arma, y luego se suelta<\u002Fh1>\n    <p style=\"margin:0;font-size:17px;line-height:1.6;text-wrap:pretty\">Una sola composición en tres tamaños. Al cargar, las terminales se encienden desde el antebrazo hasta la punta del índice. Al hacer scroll, la mano se desarma en agentes sueltos, que es justo el problema del capítulo 1 del primer proyecto. Las ilustraciones son HTML real: no hay una mano sólida debajo de las ventanas.<\u002Fp>\n    <div style=\"display:flex;flex-wrap:wrap;gap:24px;font-size:15px\"><a href=\"#H1\">1 · Escritorio<\u002Fa><a href=\"#H2\">2 · Entrada<\u002Fa><a href=\"#H3\">3 · Transición<\u002Fa><a href=\"#H4\">4 · Responsive<\u002Fa><a href=\"#H5\">5 · Capas<\u002Fa><a href=\"#H6\">6 · Provisional<\u002Fa><\u002Fdiv>\n  <\u002Fheader>\n\n  <div id=\"H1\" data-screen-label=\"1 · Composición final escritorio\" style=\"display:flex;flex-direction:column;gap:24px\">\n    <div style=\"display:flex;align-items:baseline;gap:14px\"><span style=\"background:#C9A06A;color:#0A0D14;font-weight:600;font-size:18px;padding:4px 12px;border-radius:8px\">1<\u002Fspan><h2 style=\"margin:0;font-size:40px;font-weight:600;letter-spacing:-0.02em;color:#F4F1EA\">Composición final · escritorio<\u002Fh2><span style=\"font-size:15px;color:#8C929D\">1280 × 800<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;gap:56px;align-items:flex-start\">\n      <div style=\"display:flex;flex-direction:column;gap:16px\">\n        <dc-import name=\"HeroArte\" kind=\"d\" t=\"{{ t }}\" p=\"0\" z=\"1\" guides=\"{{ guides }}\" hint-size=\"1280px,800px\"><\u002Fdc-import>\n        <div style=\"display:flex;gap:12px\">\n          <button sc-camel-on-click=\"{{ play }}\" style=\"min-height:44px;padding:0 18px;border-radius:10px;border:0;background:#C9A06A;color:#0A0D14;font-weight:600;font-size:14px;cursor:pointer\">▶ Reproducir entrada<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ toggleGuides }}\" aria-pressed=\"{{ guides }}\" style=\"min-height:44px;padding:0 18px;border-radius:10px;border:0;background:#151A25;color:#E8DCC4;font-size:14px;cursor:pointer\">{{ guidesLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:360px;display:flex;flex-direction:column;gap:18px;font-size:15px;line-height:1.6\">\n        <div><b style=\"font-weight:600;color:#F4F1EA\">Punto de encuentro.<\u002Fb> Está al 53 % del ancho y al 43 % del alto, un poco a la derecha y arriba del centro óptico. Las puntas quedan a 56 px: más cerca que en 3c, más lejos que en 3a.<\u002Fdiv>\n        <div><b style=\"font-weight:600;color:#F4F1EA\">Anatomía.<\u002Fb> Tiene unas 31 ventanas. El antebrazo son dos registros largos que se funden en la oscuridad. La muñeca tiene siete carpos mínimos. La palma, cuatro metacarpos (el del índice es la terminal más grande, el planificador). El índice tiene tres falanges y los demás dedos, dos o tres.<\u002Fdiv>\n        <div><b style=\"font-weight:600;color:#F4F1EA\">Escalas de 3c.<\u002Fb> Cada ventana varía ±5 % de ancho, ±6 % de alto y ±1,2° de giro. La luz crece del antebrazo (38 %) a la punta (100 %).<\u002Fdiv>\n        <div><b style=\"font-weight:600;color:#F4F1EA\">La punta.<\u002Fb> Es la única ventana con fondo más claro y un punto de oro. Termina en un cursor ▍ frente al vacío.<\u002Fdiv>\n        <div><b style=\"font-weight:600;color:#F4F1EA\">Texto.<\u002Fb> Sin cambios respecto a 2c: el nombre abajo a la izquierda y la frase con el acceso a proyectos abajo a la derecha. La mano humana queda sin girar, para conservar el gesto pintado.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"H2\" data-screen-label=\"2 · Entrada al cargar\" style=\"display:flex;flex-direction:column;gap:24px\">\n    <div style=\"display:flex;align-items:baseline;gap:14px\"><span style=\"background:#C9A06A;color:#0A0D14;font-weight:600;font-size:18px;padding:4px 12px;border-radius:8px\">2<\u002Fspan><h2 style=\"margin:0;font-size:40px;font-weight:600;letter-spacing:-0.02em;color:#F4F1EA\">Entrada al cargar<\u002Fh2><span style=\"font-size:15px;color:#8C929D\">2,6 s en total · sin bloquear la lectura<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;gap:24px\">\n      <sc-for list=\"{{ introBoard }}\" as=\"f\" hint-placeholder-count=\"4\">\n        <div style=\"display:flex;flex-direction:column;gap:10px;width:384px\">\n          <dc-import name=\"HeroArte\" kind=\"d\" t=\"{{ f.t }}\" p=\"0\" z=\"0.3\" hint-size=\"384px,240px\"><\u002Fdc-import>\n          <span style=\"font-size:14px;color:#C9A06A;font-variant-numeric:tabular-nums\">{{ f.time }}<\u002Fspan>\n          <span style=\"font-size:14px;line-height:1.55\">{{ f.text }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px;max-width:1608px;font-size:15px;line-height:1.6\">\n      <div><b style=\"font-weight:600;color:#F4F1EA\">Con propósito.<\u002Fb> La mano humana llega primero y la artificial se construye hacia ella. Se lee como el propio relato: un sistema que se arma para alcanzar algo.<\u002Fdiv>\n      <div><b style=\"font-weight:600;color:#F4F1EA\">Sutil.<\u002Fb> Solo hay opacidad y desplazamientos de 6 a 28 px, con ease-out. Las ventanas no escalan, ni rebotan, ni muestran texto que se teclea.<\u002Fdiv>\n      <div><b style=\"font-weight:600;color:#F4F1EA\">Reduced motion.<\u002Fb> Todo aparece de golpe, ya compuesto, y el cursor queda fijo, sin parpadear. La navegación es usable desde 0 ms en ambos casos.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"H3\" data-screen-label=\"3 · Transición al scrollytelling\" style=\"display:flex;flex-direction:column;gap:24px\">\n    <div style=\"display:flex;align-items:baseline;gap:14px\"><span style=\"background:#C9A06A;color:#0A0D14;font-weight:600;font-size:18px;padding:4px 12px;border-radius:8px\">3<\u002Fspan><h2 style=\"margin:0;font-size:40px;font-weight:600;letter-spacing:-0.02em;color:#F4F1EA\">Transición al scrollytelling<\u002Fh2><span style=\"font-size:15px;color:#8C929D\">La mano se suelta en agentes sin coordinar<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;gap:56px;align-items:flex-start\">\n      <div style=\"display:flex;flex-direction:column;gap:16px\">\n        <dc-import name=\"HeroArte\" kind=\"d\" t=\"9\" p=\"{{ p }}\" z=\"1\" next=\"true\" hint-size=\"1280px,800px\"><\u002Fdc-import>\n        <label style=\"display:flex;align-items:center;gap:16px;font-size:14px;color:#8C929D;min-height:44px\">Progreso del scroll<input type=\"range\" min=\"0\" max=\"100\" value=\"{{ pPct }}\" sc-camel-on-change=\"{{ onP }}\" style=\"width:420px\"><span style=\"color:#E8DCC4;font-variant-numeric:tabular-nums;min-width:48px\">{{ pPct }} %<\u002Fspan><\u002Flabel>\n      <\u002Fdiv>\n      <div style=\"width:360px;display:flex;flex-direction:column;gap:18px;font-size:15px;line-height:1.6\">\n        <div><b style=\"font-weight:600;color:#F4F1EA\">Relato.<\u002Fb> El hero muestra agentes coordinados en forma de mano. Al bajar, la coordinación se pierde: las ventanas se separan y quedan sueltas. El capítulo 1 empieza justo ahí, con «agentes que trabajan sin coordinarse».<\u002Fdiv>\n        <div><b style=\"font-weight:600;color:#F4F1EA\">Mecánica.<\u002Fb> El hero queda fijo durante 60 vh de scroll. En el 0–50 %, el texto se desvanece y las ventanas derivan entre 26 y 86 px desde la palma, con un giro de ±8°. La mano humana se retira 110 px y se apaga. En el 50–100 %, entra el capítulo 1 desde abajo. Después el scroll sigue normal.<\u002Fdiv>\n        <div><b style=\"font-weight:600;color:#F4F1EA\">Sin efectos.<\u002Fb> No hay explosión, partículas ni zoom. El cielo sube 40 px, un paralaje mínimo. Al subir de nuevo, la mano se rearma por el mismo camino.<\u002Fdiv>\n        <div><b style=\"font-weight:600;color:#F4F1EA\">Reduced motion y móvil.<\u002Fb> No se fija nada. El hero hace scroll como un bloque normal y la figura del capítulo 1 aparece en su sitio. En móvil, la deriva se reduce a la mitad y la fijación dura 40 vh.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:24px\">\n      <sc-for list=\"{{ transBoard }}\" as=\"f\" hint-placeholder-count=\"4\">\n        <div style=\"display:flex;flex-direction:column;gap:10px;width:384px\">\n          <dc-import name=\"HeroArte\" kind=\"d\" t=\"9\" p=\"{{ f.p }}\" z=\"0.3\" next=\"true\" hint-size=\"384px,240px\"><\u002Fdc-import>\n          <span style=\"font-size:14px;color:#C9A06A;font-variant-numeric:tabular-nums\">{{ f.label }}<\u002Fspan>\n          <span style=\"font-size:14px;line-height:1.55\">{{ f.text }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"H4\" data-screen-label=\"4 · Responsive\" style=\"display:flex;flex-direction:column;gap:24px\">\n    <div style=\"display:flex;align-items:baseline;gap:14px\"><span style=\"background:#C9A06A;color:#0A0D14;font-weight:600;font-size:18px;padding:4px 12px;border-radius:8px\">4<\u002Fspan><h2 style=\"margin:0;font-size:40px;font-weight:600;letter-spacing:-0.02em;color:#F4F1EA\">Escritorio, tablet y móvil<\u002Fh2><span style=\"font-size:15px;color:#8C929D\">La composición se escala desde el punto de encuentro, nunca desde una esquina<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;gap:48px;align-items:flex-start\">\n      <div style=\"display:flex;flex-direction:column;gap:10px\"><dc-import name=\"HeroArte\" kind=\"d\" t=\"9\" p=\"0\" z=\"0.5\" guides=\"true\" hint-size=\"640px,400px\"><\u002Fdc-import><span style=\"font-size:14px;color:#8C929D\">Escritorio · 1280 × 800 · al 50 %<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:10px\"><dc-import name=\"HeroArte\" kind=\"t\" t=\"9\" p=\"0\" z=\"0.6\" guides=\"true\" hint-size=\"500px,667px\"><\u002Fdc-import><span style=\"font-size:14px;color:#8C929D\">Tablet vertical · 834 × 1112 · al 60 %<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:10px\"><dc-import name=\"HeroArte\" kind=\"m\" t=\"9\" p=\"0\" z=\"1\" guides=\"{{ guides }}\" hint-size=\"390px,844px\"><\u002Fdc-import><span style=\"font-size:14px;color:#8C929D\">Móvil · 390 × 844 · al 100 % · guías con el botón de 1<\u002Fspan><\u002Fdiv>\n      <div style=\"width:380px;display:flex;flex-direction:column;font-size:14px;line-height:1.55\">\n        <div style=\"display:grid;grid-template-columns:88px 1fr;gap:12px;padding:0 0 10px;font-size:13px;color:#8C929D\"><span><\u002Fspan><span>Regla<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:88px 1fr;gap:12px;padding:12px 0;border-top:1px solid rgba(232,220,196,.08)\"><span style=\"color:#F4F1EA\">Ancla<\u002Fspan><span>Se fija el punto de encuentro en % del viewport y se escala la composición desde él. Las manos se cortan por los bordes exteriores, nunca por el centro.<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:88px 1fr;gap:12px;padding:12px 0;border-top:1px solid rgba(232,220,196,.08)\"><span style=\"color:#F4F1EA\">≥ 1200<\u002Fspan><span>Encuentro 53 / 43 %, escala 1,2, hueco 56 px, giro −4°. 60 estrellas.<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:88px 1fr;gap:12px;padding:12px 0;border-top:1px solid rgba(232,220,196,.08)\"><span style=\"color:#F4F1EA\">768–1199<\u002Fspan><span>Encuentro 54 / 40 %, escala 0,8, hueco 40 px, giro −5°. El texto pasa a un bloque apilado abajo.<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:88px 1fr;gap:12px;padding:12px 0;border-top:1px solid rgba(232,220,196,.08)\"><span style=\"color:#F4F1EA\">&lt; 768<\u002Fspan><span>Encuentro 55 / 37 %, escala 0,44, hueco 24 px, giro −6°. Se ven el índice, la palma y la mano humana hasta la muñeca; el antebrazo queda fuera. Las ventanas pierden el texto y conservan cabecera y punto. La punta mantiene su cursor.<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:88px 1fr;gap:12px;padding:12px 0;border-top:1px solid rgba(232,220,196,.08)\"><span style=\"color:#F4F1EA\">Horizontal<\u002Fspan><span>En móvil horizontal o con alto &lt; 560 px, se usa la regla de tablet con encuentro 52 / 46 %. El nombre se reduce a 48 px.<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:88px 1fr;gap:12px;padding:12px 0;border-top:1px solid rgba(232,220,196,.08);border-bottom:1px solid rgba(232,220,196,.08)\"><span style=\"color:#F4F1EA\">Mínimos<\u002Fspan><span>El hueco nunca baja de 20 px, ni la punta de 8 px de alto. El círculo de 2 × hueco alrededor del encuentro debe quedar siempre dentro del encuadre y fuera de la zona de texto.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"H5\" data-screen-label=\"5 · Capas\" style=\"display:flex;flex-direction:column;gap:24px;width:1680px\">\n    <div style=\"display:flex;align-items:baseline;gap:14px\"><span style=\"background:#C9A06A;color:#0A0D14;font-weight:600;font-size:18px;padding:4px 12px;border-radius:8px\">5<\u002Fspan><h2 style=\"margin:0;font-size:40px;font-weight:600;letter-spacing:-0.02em;color:#F4F1EA\">Especificación de capas<\u002Fh2><span style=\"font-size:15px;color:#8C929D\">De atrás hacia delante<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;font-size:14px;line-height:1.55\">\n      <div style=\"display:grid;grid-template-columns:56px 200px 260px 1fr 340px;gap:24px;padding:0 0 10px;font-size:13px;color:#8C929D\"><span>Capa<\u002Fspan><span>Elemento<\u002Fspan><span>Medio<\u002Fspan><span>Detalle<\u002Fspan><span>Movimiento<\u002Fspan><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:56px 200px 260px 1fr 340px;gap:24px;padding:14px 0;border-top:1px solid rgba(232,220,196,.08)\"><span style=\"color:#C9A06A\">L0<\u002Fspan><span style=\"color:#F4F1EA\">Fondo Cosmos<\u002Fspan><span>Color sólido #0A0D14<\u002Fspan><span style=\"color:#8C929D\">Sin degradados ni viñeta. Continúa sin corte en la sección de proyectos.<\u002Fspan><span style=\"color:#8C929D\">Ninguno.<\u002Fspan><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:56px 200px 260px 1fr 340px;gap:24px;padding:14px 0;border-top:1px solid rgba(232,220,196,.08)\"><span style=\"color:#C9A06A\">L1<\u002Fspan><span style=\"color:#F4F1EA\">Estrellas<\u002Fspan><span>SVG o canvas, semilla fija<\u002Fspan><span style=\"color:#8C929D\">60 / 50 / 32 puntos de 1–2 px, marfil o gris al 15–45 %. Un 6 % en oro y 2,2 px. Nunca dentro del círculo de encuentro.<\u002Fspan><span style=\"color:#8C929D\">Fundido de 0 a 0,6 s. Paralaje de −40 px durante la transición.<\u002Fspan><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:56px 200px 260px 1fr 340px;gap:24px;padding:14px 0;border-top:1px solid rgba(232,220,196,.08)\"><span style=\"color:#C9A06A\">L2<\u002Fspan><span style=\"color:#F4F1EA\">Mano humana<\u002Fspan><span>Imagen raster con alfa (WebP / AVIF, 2×)<\u002Fspan><span style=\"color:#8C929D\">Recorte pictórico. Punta del índice en (14, 170) sobre un lienzo de 540 × 320. Ancho = 1,26 × escala × 540. Gradación: sepia 0,18, saturación 0,85, brillo 0,96. Sin girar.<\u002Fspan><span style=\"color:#8C929D\">Entrada de 0,2 a 1,1 s: opacidad y −28 px. Transición: +110 px y se apaga.<\u002Fspan><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:56px 200px 260px 1fr 340px;gap:24px;padding:14px 0;border-top:1px solid rgba(232,220,196,.08)\"><span style=\"color:#C9A06A\">L3<\u002Fspan><span style=\"color:#F4F1EA\">Mano de terminales<\u002Fspan><span>HTML (o SVG con foreignObject); cada ventana es un nodo<\u002Fspan><span style=\"color:#8C929D\">Espacio de mano de 1000 × 460 con la punta en (812, 197), girado y escalado desde la punta. 31 ventanas: fondo #151A25, cabecera marfil al 9 %, radio ≤ 6 px, Geist Mono. Brillo del 38 al 100 % según la posición. Geometría fuente: segs() en <a href=\"HeroArte.dc.html\">HeroArte<\u002Fa>.<\u002Fspan><span style=\"color:#8C929D\">Entrada de 0,6 a 1,85 s, escalonada del antebrazo a la punta: 0,35 s por ventana, opacidad y +6 px. Transición: deriva radial desde la palma.<\u002Fspan><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:56px 200px 260px 1fr 340px;gap:24px;padding:14px 0;border-top:1px solid rgba(232,220,196,.08)\"><span style=\"color:#C9A06A\">L4<\u002Fspan><span style=\"color:#F4F1EA\">Punta y cursor<\u002Fspan><span>Parte de L3<\u002Fspan><span style=\"color:#8C929D\">Ventana «coder» con fondo más claro, punto de oro #C9A06A y cursor ▍ en oro.<\u002Fspan><span style=\"color:#8C929D\">Visible desde 1,7 s y dos parpadeos (1,9 y 2,3 s), luego fijo. Sin parpadeo con reduced motion.<\u002Fspan><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:56px 200px 260px 1fr 340px;gap:24px;padding:14px 0;border-top:1px solid rgba(232,220,196,.08)\"><span style=\"color:#C9A06A\">L5<\u002Fspan><span style=\"color:#F4F1EA\">Navegación<\u002Fspan><span>HTML<\u002Fspan><span style=\"color:#8C929D\">JORGE, Proyectos, Sobre mí, Contacto y CV en 14 px. En móvil, JORGE y Menú.<\u002Fspan><span style=\"color:#8C929D\">Fundido de 0 a 0,4 s. Al salir del hero, se convierte en la barra fija de 56 px.<\u002Fspan><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:56px 200px 260px 1fr 340px;gap:24px;padding:14px 0;border-top:1px solid rgba(232,220,196,.08);border-bottom:1px solid rgba(232,220,196,.08)\"><span style=\"color:#C9A06A\">L6<\u002Fspan><span style=\"color:#F4F1EA\">Nombre, frase y acceso<\u002Fspan><span>HTML · h1 = «Jorge»<\u002Fspan><span style=\"color:#8C929D\">Dentro de la zona de texto (guía punteada). Contraste AA sobre #0A0D14. Las ilustraciones L1–L4 son aria-hidden, con una descripción alternativa en el figcaption, oculto visualmente.<\u002Fspan><span style=\"color:#8C929D\">Entrada de 1,8 a 2,3 s: opacidad y +8 px. Transición: se apaga en el primer 50 %.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"H6\" data-screen-label=\"6 · Recursos provisionales\" style=\"display:flex;flex-direction:column;gap:24px;width:1680px\">\n    <div style=\"display:flex;align-items:baseline;gap:14px\"><span style=\"background:#C9A06A;color:#0A0D14;font-weight:600;font-size:18px;padding:4px 12px;border-radius:8px\">6<\u002Fspan><h2 style=\"margin:0;font-size:40px;font-weight:600;letter-spacing:-0.02em;color:#F4F1EA\">Qué sigue siendo provisional<\u002Fh2><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px 40px;font-size:15px;line-height:1.6\">\n      <div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-size:13px;color:#B08C5C\">Bloqueante<\u002Fspan><b style=\"font-weight:600;color:#F4F1EA\">Mano humana definitiva<\u002Fb><span>La actual es un recorte de 540 × 320 px del detalle de Adán, demasiado pequeño para 2×. Hace falta una fuente de alta resolución (≥ 2400 px de ancho), con la licencia de la reproducción fotográfica verificada (la pintura es de dominio público, la foto puede no serlo), un recorte limpio del borde del brazo y una gradación final. La alternativa es una ilustración propia con el mismo gesto.<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-size:13px;color:#B08C5C\">Bloqueante<\u002Fspan><b style=\"font-weight:600;color:#F4F1EA\">Contenido de las terminales<\u002Fb><span>Los textos (kairos, retriever, recall@5 0.89…) son de ejemplo. Deben salir de tus herramientas y agentes reales, sin métricas inventadas. Si no hay datos, mejor usar comandos y nombres que cifras.<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-size:13px;color:#B08C5C\">Por confirmar<\u002Fspan><b style=\"font-weight:600;color:#F4F1EA\">Logotipos de herramientas<\u002Fb><span>Ahora no hay ninguno. Si se añaden, serán glifos monocromos de 8 px en la cabecera de 3 o 4 ventanas como máximo, nunca en la punta.<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-size:13px;color:#B08C5C\">Por confirmar<\u002Fspan><b style=\"font-weight:600;color:#F4F1EA\">Frase y nombre<\u002Fb><span>«Construyo sistemas de IA y explico cómo funcionan.» viene de 2c. ¿«Jorge» solo o el nombre completo en el h1? Afecta al ancho de la zona de texto en móvil.<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-size:13px;color:#B08C5C\">Por validar<\u002Fspan><b style=\"font-weight:600;color:#F4F1EA\">Transición en dispositivos reales<\u002Fb><span>La fijación y la deriva son una propuesta de diseño. El rendimiento de unas 31 ventanas animadas en móviles de gama media y la sensación al scroll deben probarse al implementar.<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-size:13px;color:#8C929D\">Descartado<\u002Fspan><b style=\"font-weight:600;color:#F4F1EA\">Fuente The Calling<\u002Fb><span>No se usa en el hero. Si reaparece como glifo de identidad, antes hay que verificar su licencia.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { t: 9, p: 0.45, guides: false };\n  componentWillUnmount() { cancelAnimationFrame(this._raf); }\n  play = () => {\n    cancelAnimationFrame(this._raf);\n    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) { this.setState({ t: 9 }); return; }\n    const start = performance.now();\n    const step = now => {\n      const t = (now - start) / 1000;\n      this.setState({ t: Math.min(t, 9) });\n      if (t < 3) this._raf = requestAnimationFrame(step); else this.setState({ t: 9 });\n    };\n    this.setState({ t: 0 });\n    this._raf = requestAnimationFrame(step);\n  };\n  renderVals() {\n    const { t, p, guides } = this.state;\n    return {\n      t, p, guides, pPct: Math.round(p * 100),\n      guidesLabel: guides ? 'Ocultar guías' : 'Mostrar guías',\n      toggleGuides: () => this.setState(s => ({ guides: !s.guides })),\n      play: this.play,\n      onP: e => this.setState({ p: Number(e.target.value) / 100 }),\n      introBoard: [\n        { t: 0.4, time: '0 – 0,6 s', text: 'Aparecen el cielo y la navegación. La mano humana empieza a entrar desde la derecha.' },\n        { t: 1.0, time: '0,6 – 1,2 s', text: 'Las terminales se encienden desde el antebrazo, que sigue tenue.' },\n        { t: 1.55, time: '1,2 – 1,85 s', text: 'La palma y los dedos se completan. La punta del índice se enciende la última.' },\n        { t: 9, time: '1,8 – 2,6 s', text: 'Entran el nombre y la frase. El cursor parpadea dos veces y queda fijo.' }\n      ],\n      transBoard: [\n        { p: 0, label: '0 %', text: 'Hero en reposo. El scroll empieza.' },\n        { p: 0.3, label: '30 %', text: 'El texto se va. Las ventanas se separan y la mano humana se retira.' },\n        { p: 0.65, label: '65 %', text: 'Quedan agentes sueltos y tenues. Entra el capítulo 1 desde abajo.' },\n        { p: 1, label: '100 %', text: 'Termina la fijación y empieza el scrollytelling v1, sin cambios.' }\n      ]\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
